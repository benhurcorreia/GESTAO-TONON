</style></head><body><div id="app"><div class="loading"><span class="brandmark">T</span><h1>Gestão Tonon</h1><p>Preparando sua visão das fazendas…</p></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="modal" aria-labelledby="modal-title"></dialog><script type="module">const fields = [
 ['tanque','Leite no tanque','L/dia',0,200000,true],['bezerra','Leite para bezerras','L/dia',0,50000],['consumo','Consumo interno','L/dia',0,50000],['descarte','Leite descartado','L/dia',0,50000],['vacas','Vacas em lactação','vacas',1,20000,true],['gordura','Gordura','%',0,10],['proteina','Proteína','%',0,10],['ccs','CCS','mil cél/mL',0,10000],['nul','NUL','mg/dL',0,100]
].map(row=>[...row.slice(0,5),!!row[5]]);
const defaultTargets={ccs:200,nulMin:10,nulMax:14,queda:5};
function derive(v){
 const complete=['tanque','bezerra','consumo','descarte'].every(k=>v[k]!=null);
 const total=complete? v.tanque+v.bezerra+v.consumo+v.descarte:null;
 return {...v,total,lvd:total!=null&&v.vacas>0?total/v.vacas:null,gp:v.proteina>0&&v.gordura!=null?v.gordura/v.proteina:null,pdesc:total>0?v.descarte/total*100:null};
}
function validateVisit(body){
 const v={date:String(body.date||''),obs:String(body.obs||'').trim().slice(0,3000)};
 if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||!Number.isFinite(Date.parse(v.date))||new Date(v.date).toISOString().slice(0,10)!==v.date)throw Error('Informe uma data válida.');
 if(v.date>new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'}))throw Error('A visita não pode estar no futuro.');
 for(const [key,label,,min,max,required] of fields){
  const x=body[key];if(x==null||x===''){if(required)throw Error('Preencha: '+label);v[key]=null;continue;}
  const n=typeof x==='number'?x:NaN;if(!Number.isFinite(n)||n<min||n>max||(key==='vacas'&&!Number.isInteger(n)))throw Error('Confira o valor de '+label+'.');v[key]=n;
 }return v;
}
function insights(visits,targets=defaultTargets){
 const sorted=[...visits].sort((a,b)=>a.date.localeCompare(b.date));const v=sorted.at(-1),prev=sorted.at(-2);const alerts=[];
 if(!v)return alerts;
 if(v.ccs!=null&&v.ccs>targets.ccs)alerts.push({key:'ccs',title:'CCS acima da meta',text:`Última leitura: ${fmt(v.ccs)} mil cél/mL. Meta: até ${fmt(targets.ccs)}. Revisar com o consultor.`});
 if(v.nul!=null&&(v.nul<targets.nulMin||v.nul>targets.nulMax))alerts.push({key:'nul',title:'NUL fora da faixa',text:`Última leitura: ${fmt(v.nul,1)} mg/dL. Faixa definida: ${targets.nulMin} a ${targets.nulMax}.`});
 if(prev?.lvd>0&&v.lvd!=null&&(v.lvd/prev.lvd-1)*100<=-targets.queda)alerts.push({key:'lvd',title:'Queda de produtividade',text:`Redução de ${fmt((1-v.lvd/prev.lvd)*100,1)}% em relação à visita anterior.`});
 if(v.total==null)alerts.push({key:'missing',title:'Produção total incompleta',text:'Informe todos os destinos do leite para calcular o total e os litros por vaca. Use zero somente quando não houver volume.'});
 return alerts;
}
function fmt(n,d=0){return n==null?'—':Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});}
function dateFmt(v){return v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR'):'—';}
function reportLines(f,visits){
 const v=visits.at(-1);if(!v)return ['Nenhuma visita no período.'];
 const first=visits[0];const delta=first.lvd>0&&v.lvd!=null?(v.lvd/first.lvd-1)*100:null;
 return [`Relatório de acompanhamento — ${f.name}`,`Produtor: ${f.producer||'Não informado'} | Município: ${f.city||'Não informado'}`,`Período: ${dateFmt(first.date)} a ${dateFmt(v.date)} | ${visits.length} visita(s)`,
 `Na última visita, foram registrados ${fmt(v.tanque)} L/dia no tanque e ${fmt(v.vacas)} vacas em lactação.`,v.total==null?'Produção total indisponível: há destinos do leite não informados.':`Produção total: ${fmt(v.total)} L/dia. Produtividade: ${fmt(v.lvd,1)} L/vaca/dia.`,
 ...(visits.length>1&&delta!=null?[`Variação de produtividade no período: ${fmt(delta,1)}%.`]:[]),

function makePDF(f,visits){
 const pages=[];let ops=[],y=790;
 const enc=s=>String(s).replace(/[—–]/g,'-').replace(/[^\x20-\xFF]/g,'').replace(/([\\()])/g,'\\$1');
 const line=(s,size=11)=>{if(y<60){pages.push(ops.join('\n'));ops=[];y=790;}ops.push(`BT /F1 ${size} Tf 0.10 0.20 0.16 rg 45 ${y} Td (${enc(s)}) Tj ET`);y-=size+9;};
 const para=(s,size=11)=>{let l='';for(const w of s.split(/\s+/)){if((l+w).length>88){line(l,size);l='';}l+=w+' ';}if(l)line(l,size);y-=5;};
 line('GESTÃO TONON',22);line('RELATÓRIO DE ACOMPANHAMENTO',10);y-=15;
 for(const [i,s] of reportLines(f,visits).entries())para(s,i===0?15:11);
 y-=10;line('HISTÓRICO DE VISITAS',14);
 line('Data              Tanque (L/dia)       Vacas       L/vaca/dia       CCS       NUL',10);
 for(const v of visits)line(`${dateFmt(v.date)}       ${fmt(v.tanque)}          ${fmt(v.vacas)}          ${fmt(v.lvd,1)}          ${fmt(v.ccs)}          ${fmt(v.nul,1)}`,10);
 if(visits.filter(v=>v.lvd!=null).length>1){if(y<230){pages.push(ops.join('\n'));ops=[];y=790;}y-=20;line('EVOLUÇÃO DA PRODUÇÃO POR VACA (L/dia)',12);const vals=visits.filter(v=>v.lvd!=null),max=Math.max(...vals.map(v=>v.lvd),1)*1.15,bottom=y-130;
 ops.push(`0.85 0.88 0.86 RG 0.5 w 50 ${bottom} m 540 ${bottom} l S`);
 const points=vals.map((v,i)=>[50+i*490/(vals.length-1),bottom+v.lvd/max*110]);
 ops.push('0.15 0.38 0.29 RG 2 w '+points.map(([x,z],i)=>`${x.toFixed(1)} ${z.toFixed(1)} ${i?'l':'m'}`).join(' ')+' S');y=bottom-20;line(dateFmt(vals[0].date)+'                                                    '+dateFmt(vals.at(-1).date),10);
 }
 pages.push(ops.join('\n'));const objects=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'];
 const kids=[];for(const content of pages){const p=objects.length+1,c=p+1;kids.push(`${p} 0 R`);objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${c} 0 R >>`);objects.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);}
 objects[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;let out='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`;});const xref=out.length;out+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
 return Uint8Array.from(out,c=>c.charCodeAt(0));
}

const paths={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',farm:'M3 21V10l9-7 9 7v11H3z M9 21v-8h6v8 M2 10l10-8 10 8',chart:'M3 3v18h18 M6 15l5-5 4 3 6-8',file:'M14 2H5v20h14V7l-5-5z M14 2v6h5 M8 12h8 M8 16h8',users:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3 M13 4a4 4 0 0 1 0 7 M22 21v-3a4 4 0 0 0-3-4 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M14 7l5 5-5 5',down:'M12 3v12 M7 10l5 5 5-5 M4 16v5h16v-5',calendar:'M3 5h18v16H3z M7 2v6 M17 2v6 M3 10h18',search:'M21 21l-5-5 M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',drop:'M12 2C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-13z',alert:'M12 3L2 21h20L12 3z M12 9v5 M12 17v1',chevron:'M9 5l7 7-7 7',close:'M6 6l12 12 M6 18L18 6',refresh:'M20 7v5h-5 M4 17v-5h5 M5 7a8 8 0 0 1 14-1l1 6 M4 12l1 6a8 8 0 0 0 14-1',check:'M5 12l4 4L19 6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',logout:'M9 3H3v18h6 M10 12h11 M16 7l5 5-5 5'};

function demoData(){const farms=[['demo-1','Fazenda Santa Helena','Roberto Almeida','Passos, MG'],['demo-2','Fazenda Boa Vista','Mariana Costa','São João Batista do Glória, MG'],['demo-3','Sítio Recanto Verde','Antônio Pereira','Itaú de Minas, MG'],['demo-4','Fazenda São José','Carlos Ferreira','Passos, MG']].map(([id,name,producer,city])=>({id,name,producer,city,targets:{...defaultTargets},recommendations:'Acompanhar a evolução dos indicadores nas próximas visitas. Metas ilustrativas; validar com o consultor.'}));
 const visits=[];farms.forEach((f,j)=>{for(let i=0;i<8;i++){let vacas=[128,86,54,112][j]+i,ratio=[26,23,21,25][j]+i*.55+(i%2?.4:-.3);if(j===1&&i>5)ratio-=4;const tanque=Math.round(vacas*ratio),bezerra=85+j*12,consumo=10,descarte=j===1?80:16;visits.push(derive({id:f.id+'-'+i,farmId:f.id,date:`2026-${String(i+3).padStart(2,'0')}-15`,tanque,bezerra,consumo,descarte,vacas,gordura:3.65+(i%3)*.08,proteina:3.22+(i%2)*.05,ccs:j===1?260+i*12:155-i*5+j*15,nul:j===2?15.2:12.2+j*.2,obs:i===7?'Registro ilustrativo para demonstração do acompanhamento.':''}));}});return {farms,visits,members:[]};}

async function api(path,body,method='POST'){const r=await fetch('/api/'+path,{method:body?method:'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Object.assign(Error(data.error||'Não foi possível concluir.'),{status:r.status});return data;}
async function reload(initial=false){try{const data=await api('state');S.user=data.user;live={farms:data.farms,visits:data.visits,members:data.members||[]};if(!S.demo)Object.assign(S,live);S.error=null;if(!S.selected)S.selected=S.farms[0]?.id||null;if(initial&&S.user.role==='admin'&&!S.farms.length)setDemo(true);else render();}catch(e){if(e.status===401){S.user=null;welcome();}else{S.error=e.message;render();}}}
function toast(s){$('#toast').textContent=s;setTimeout(()=>$('#toast').textContent='',4500);}
function selected(){return S.farms.find(f=>f.id===S.selected);}
function visits(f,filtered=true){return S.visits.filter(v=>v.farmId===f?.id&&(!filtered||(!S.start||v.date>=S.start)&&(!S.end||v.date<=S.end))).sort((a,b)=>a.date.localeCompare(b.date));}
function latest(f){return visits(f,false).at(-1);}
function status(f){const v=visits(f,false);return !v.length?'<span class="badge neutral">Sem visitas</span>':insights(v,f.targets).length?'<span class="badge attention">Atenção</span>':'<span class="badge">Dentro das metas</span>';}
function button(text,act,ico,cls='',extra=''){return `<button class="${cls}" data-action="${act}" ${extra}>${ico?icon(ico):''}${text}</button>`;}

function chart(v,key,label,color='#55784e'){const vals=v.map(x=>x[key]).filter(x=>x!=null);if(!vals.length)return `<div class="empty"><p>Sem dados para este indicador no período.</p></div>`;const W=660,H=230,left=44,right=20,top=22,bottom=35,max=Math.max(...vals,1)*1.15;const X=i=>left+(W-left-right)*(v.length===1?.5:i/(v.length-1)),Y=n=>H-bottom-(H-top-bottom)*n/max;let d='',start=false;v.forEach((x,i)=>{if(x[key]==null){start=false;return;}d+=(start?'L':'M')+X(i).toFixed(1)+','+Y(x[key]).toFixed(1);start=true;});const full=vals.length===v.length&&v.length>1;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title><defs><linearGradient id="fill-${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".13"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>{const n=max*i/3;return `<path class="grid" d="M${left},${Y(n)}H${W-right}"/><text x="${left-10}" y="${Y(n)+3}" text-anchor="end">${fmt(n,key==='lvd'||key==='nul'?1:0)}</text>`;}).join('')}${full?`<path d="${d}L${X(v.length-1)},${H-bottom}L${X(0)},${H-bottom}Z" fill="url(#fill-${key})"/>`:''}<path class="line" style="stroke:${color}" d="${d}"/>${v.map((x,i)=>`${x[key]!=null?`<circle class="dot" style="fill:${color}" cx="${X(i)}" cy="${Y(x[key])}" r="3.7"><title>${dateFmt(x.date)}: ${fmt(x[key],1)}</title></circle>`:''}${(v.length<10||i%Math.ceil(v.length/8)===0||i===v.length-1)?`<text x="${X(i)}" y="${H-9}" text-anchor="middle">${new Date(x.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short',day:'2-digit'})}</text>`:''}`).join('')}</svg>`;}

 return `<div class="page-head"><div><div class="eyebrow" style="margin-bottom:7px">Acompanhamento de fazendas</div><h1>O campo, em perspectiva.</h1><p>Uma visão clara de cada fazenda. Uma decisão melhor a cada visita.</p></div><div class="actions">${button('Nova fazenda','new-farm','plus','primary')}</div></div><div class="stats">${stat('Fazendas acompanhadas',fs.length,'',`${vs.length} com visitas registradas`,'farm',true)}${stat('Produção total',complete.length?fmt(sum):'—','L/dia',`Última visita · ${complete.length}/${fs.length} fazendas com total completo`,'drop')}${stat('Vacas em lactação',fmt(cows),'',`Soma das últimas visitas registradas`,'users')}${stat('Precisam de atenção',alerts.length,'fazendas','Indicadores fora das metas ou dados incompletos','alert')}</div>${!fs.length?empty('Sua primeira fazenda começa aqui.','Cadastre a propriedade e registre a primeira visita para acompanhar a evolução.',button('Cadastrar fazenda','new-farm','plus','primary')):`<div class="two-cols"><section class="card"><div class="card-header"><div><h2>Evolução da produtividade</h2><p>Litros por vaca por dia · histórico de visitas</p></div><select id="farm-select" aria-label="Fazenda do gráfico" style="max-width:180px;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:11px;background:white">${fs.map(x=>`<option value="${x.id}" ${x.id===f?.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="chart-body">${chart(visits(f,false),'lvd','Produção por vaca')}<div class="chart-legend"><span><i></i>Produção por vaca</span><span>Sem estimativas para dados ausentes</span></div></div></section><section class="card"><div class="card-header"><div><h2>No seu radar</h2><p>Prioridades para o próximo acompanhamento</p></div><span class="counter">${alerts.length}</span></div><div class="alert-list">${alerts.slice(0,3).map(x=>{const a=insights(visits(x,false),x.targets)[0];return `<div class="alert-item"><span class="alert-icon">${icon('alert')}</span>< function reportView(){const f=selected();if(!f)return empty('Os relatórios começam com uma fazenda','Cadastre uma propriedade e registre a primeira visita.');const v=visits(f),u=v.at(-1);return `<div class="page-head"><div><h1>Relatórios</h1><p>Os dados viram um acompanhamento pronto para compartilhar.</p></div><div class="actions">${button('Imprimir','print','file')}${button('Baixar PDF','pdf','down','primary')}</div></div>${filters()}${!v.length?empty('Sem visitas neste período','Ajuste o período para gerar o relatório.'):`<article class="report"><div class="report-top"><div>${brand()}<h1>${esc(f.name)}</h1><p class="muted">${esc(f.producer)} · ${esc(f.city||'')}</p></div><div class="muted" style="font-size:11px;text-align:right">RELATÓRIO DE ACOMPANHAMENTO<br>${dateFmt(v[0].date)} a ${dateFmt(u.date)}<br>${v.length} visitas${S.demo?'<br>DEMONSTRAÇÃO · DADOS FICTÍCIOS':''}</div></div><div class="stats">${stat('Produção por vaca',fmt(u.lvd,1),'L/dia','','chart')}${stat('Produção total',fmt(u.total),'L/dia','','drop')}${stat('Vacas em lactação',fmt(u.vacas),'','','users')}${stat('CCS',fmt(u.ccs),'mil/mL','','chart')}</div><h2>Resumo do período</h2>${reportLines(f,v).slice(3).filter(x=>!x.startsWith('Recomendações')&&!/^\d{2}\//.test(x)).map(x=>`<p>${esc(x)}</p>`).join('')}<h2>Evolução da produtividade</h2>${chart(v,'lvd','Evolução da produtividade')}<h2>Recomendações do consultor</h2><textarea id="recommendations" aria-label="Recomendações do consultor" placeholder="Registre as orientações para o produtor…">${esc(f.recommendations)}</textarea><div style="margin-top:10px">${button('Salvar recomendações','save-recommendations','check','tiny')}</div><h2>Observações das visitas</h2>${v.filter(x=>x.obs).map(x=>`<p><b>${dateFmt(x.date)}</b><br>${esc(x.obs)}</p>`).join('')||'<p class="muted">Nenhuma observação registrada.</p>'}<div class="report-note">Metas de acompanhamento: CCS até ${f.targets.ccs} mil cél/mL; NUL entre ${f.targets.nulMin} e ${f.targets.nulMax} mg/dL. Critérios configuráveis pelo consultor.</div><div class="report-footer"><span>Gestão Tonon · Acompanhamento de fazendas leiteiras</span><span>${new Date().toLocaleDateString('pt-BR')}</span></div></article>`}`;}
function accessView(){return `<div class="page-head"><div><h1>Pessoas e acessos</h1><p>Cada produtor preenche apenas os dados da sua fazenda.</p></div>${button('Cadastrar acesso','new-member','plus','primary')}</div><div class="help">Cadastre aqui o e-mail que a pessoa usará para entrar. O acesso ao endereço do aplicativo também precisa estar liberado nas opções de compartilhamento do site. Nenhum convite é enviado por esta tela.</div><section class="card"><div class="table-wrap"><table><thead><tr><th>E-mail</th><th>Perfil</th><th>Fazenda</th><th>Situação</th><th></th></tr></thead><tbody><tr><td>${esc(S.user?.email||'Proprietário')}</td><td>Administrador proprietário</td><td>Todas</td><td><span class="badge">Ativo</span></td><td></td></tr>${S.members.map((m,i)=>`<tr><td>${esc(m.email)}</td><td>${m.role==='admin'?'Consultor':'Produtor'}</td><td>${esc(S.farms.find(f=>f.id===m.farmId)?.name||(m.role==='admin'?'Todas':'—'))}</td><td><span class="badge ${m.disabled?'neutral':''}">${m.disabled?'Desativado':'Cadastrado'}</span></td><td>${button('Editar','edit-member',null,'tiny ghost',`data-index="${i}"`)}</td></tr>`).join('')}</tbody></table></div></section><div style="margin-top:25px">${button('Exportar cópia dos dados','export','down')}</div>`;}
function render(){if(!S.user&&!S.demo){welcome();return;}if(S.error){$('#app').innerHTML=empty('Não foi possível carregar',esc(S.error),button('Tentar novamente','refresh','refresh'));return;}if(!S.demo&&S.user?.role==='pending'){$('#app').innerHTML=`<div class="loading">${brand()}<h1>Aguardando liberação</h1><p>Peça ao consultor para cadastrar o e-mail ${esc(S.user.email)}.</p>${button('Verificar acesso','refresh','refresh')}<a href="/signout-with-chatgpt?return_to=/" target="_top">Sair</a></div>`;return;}if((!S.demo&&S.user?.role==='client')||S.previewClient){renderClient();return;}
 const nav=[['overview','Visão geral','grid'],['farms','Fazendas','farm'],['farm','Acompanhamento','chart'],['reports','Relatórios','file'],['access','Pessoas e acessos','users']];
 $('#app').innerHTML=`<aside class="sidebar">${brand()}<div class="eyebrow">Espaço do consultor</div><nav class="nav" aria-label="Menu principal">${nav.map(([k,l,i])=>button(`<span>${l}</span>`,'nav',i,k===S.view?'active':'',`data-view="${k}" title="${l}"`)).join('')}</nav><div class="sidebar-bottom"><div class="side-note">${icon('drop')}<strong>Cada visita conta.</strong><span class="muted">Transforme os dados do campo em decisões bem informadas.</span></div><div class="profile"><span class="avatar">GT</span><div><b>Área do consultor</b><small>Gestão Tonon</small></div></div></div></aside><div class="shell"><header class="topbar"><div class="crumb">Gestão Tonon <span style="margin-left:9px">/</span><b>${nav.find(x=>x[0]===S.view)?.[1]||'Visão geral'}</b></div><div class="top-actions"><span>${icon('calendar')}${new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}</span><span><i class="online"></i>${S.demo?'Demonstração':'Conectado'}</span>${button('','refresh','refresh','ghost','aria-label="Atualizar dados"')}<a href="/signout-with-chatgpt?return_to=/" target="_top" aria-label="Sair">${icon('logout')}</a></div></header><main class="content">${S.demo?`<div class="demo-bar"><span><strong>Modo demonstração</strong>Dados fictícios para explorar o aplicativo.</span>${button(S.user?'Usar meus dados':'Entrar na conta','exit-demo',null,'tiny ghost')}</div>`:''}${S.view==='overview'?overview():S.view==='farm'?farmView():S.view==='reports'?reportView():S.view==='access'?accessView():`<div class="page-head"><div><h1>Fazendas</h1><p>Históricos independentes, acompanhamento em um só lugar.</p></div><div class="actions">${button('Ver formulário do cliente','preview-client','file')}${button('Nova fazenda','new-farm','plus','primary')}</div></div>${S.farms.length?farmsTable():empty('Cadastre a primeira fazenda','O histórico ficará disponível a cada nova visita.')}`}<footer class="footnote">Gestão Tonon · Inteligência no campo ${!S.demo?` · <button class="ghost tiny" data-action="demo">Explorar demonstração</button>`:''}</footer></main></div>`;
}
function welcome(){$('#app').innerHTML=`<main class="welcome"><section class="welcome-copy">${brand()}<h1>O campo, em<br>perspectiva.</h1><p>Visitas organizadas. Indicadores claros. Uma visão completa da evolução de cada fazenda.</p><a href="/signin-with-chatgpt?return_to=/" target="_top" class="primary">Entrar com ChatGPT ${icon('arrow')}</a><div style="margin-top:15px">${button('Conhecer a demonstração','demo','chart','ghost')}</div>${S.error?`<p class="form-error">${esc(S.error)}</p>`:''}</section><section class="welcome-art"><svg viewBox="0 0 400 260" fill="none" aria-hidden="true"><path d="M0 215Q120 50 400 170 M0 250Q130 85 400 215 M0 175Q130 5 400 125" stroke="#dce9b5" stroke-width="1.3" opacity=".4"/><path d="M100 170V80l100-65 100 65v90H100z M170 170v-65h60v65" stroke="#dce9b5" stroke-width="2"/><path d="M0 220l80-30 65 4 80-60 70 5 105-50" stroke="#dce9b5" stroke-width="4"/></svg><h2>Cada visita conta.</h2><p>Gestão próxima de quem produz.<br>Decisões apoiadas em dados.</p></section></main>`;}
function inputField(key,label,unit,min,max,required,v){return `<div class="field"><label for="f-${key}">${label} <small>${unit}${required?' · obrigatório':' · opcional'}</small></label><input id="f-${key}" name="${key}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${key==='vacas'?'1':'any'}" ${required?'required':''} value="${v?.[key]??''}" placeholder="${required?'Informe o valor':'Não informado'}"></div>`;}
function visitForm(v,client=false){const f=selected();return `<form id="visit-form" data-edit="${v?.date||''}"><div class="form-grid"><div class="field full"><label for="f-date">Data da visita</label><input id="f-date" name="date" type="date" required value="${v?.date||new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'})}" max="${new Date().toLocaleDateString('sv-SE',{timeZone:'America/Sao_Paulo'})}" ${v?'readonly':''}></div></div><div class="form-section">01 · Produção de leite</div><div class="form-grid">${fields.slice(0,4).map(x=>inputField(...x,v)).join('')}</div><div class="help">Informe zero quando não houver volume. Campos em branco ficam como não informados e impedem o cálculo da produção total.</div><div class="form-section">02 · Rebanho</div><div class="form-grid">${inputField(...fields[4],v)}</div><div class="form-section">03 · Qualidade do leite</div><div class="form-grid">${fields.slice(5).map(x=>inputField(...x,v)).join('')}<div class="field full"><label for="f-obs">Observações da visita <small>opcional</small></label><textarea id="f-obs" name="obs" rows="3" maxlength="3000" placeholder="Registre o que merece atenção nesta visita…">${esc(v?.obs||'')}</textarea></div></div><div id="form-error" class="form-error" role="alert"></div><div class="form-footer"><small>${client?'Seu acesso permite apenas enviar dados.':'Os gráficos e o relatório serão atualizados ao salvar.'}</small><button class="primary" type="submit">${icon('check')}${v?'Salvar alterações':'Enviar visita'}</button></div>${!v?`<div style="margin-top:12px">${button('Recuperar rascunho neste dispositivo','recover-draft',null,'tiny ghost')}<small id="draft-status" class="muted"></small></div>`:''}</form>`;}
function renderClient(){const f=selected()||S.farms[0];if(!f){toast('Cadastre uma fazenda primeiro.');S.previewClient=false;S.view='farms';render();return;}S.selected=f.id;$('#app').innerHTML=`<main class="client-shell"><header class="client-header">${brand()}${S.previewClient?button('Voltar ao painel','back-admin','arrow','tiny'):'<a href="/signout-with-chatgpt?return_to=/" target="_top">Sair</a>'}</header>${S.previewClient?'<div class="demo-bar">Prévia do formulário do produtor. O envio fica desativado nesta visualização.</div>':''}<div class="page-head"><div><div class="eyebrow">Registro de acompanhamento</div><h1>Vamos registrar a visita?</h1><p>${esc(f.name)} · ${esc(f.producer)}</p></div></div><section class="card">${visitForm(null,true)}</section><div style="margin:30px 0"><h3 style="font-size:14px">Envios recebidos</h3><p class="muted" style="font-size:11px">Para corrigir um envio, entre em contato com o consultor.</p>${S.visits.filter(v=>v.farmId===f.id).reverse().slice(0,10).map(v=>`<div class="metric-row"><span>${dateFmt(v.date)}</span><span class="badge">Recebido</span></div>`).join('')||'<p class="muted" style="margin-top:12px">Nenhuma visita enviada ainda.</p>'}</div></main>`;}
function modal(title,html){$('#modal').innerHTML=`<div class="modal-head"><h2 id="modal-title">${title}</h2>${button('','close','close','ghost','aria-label="Fechar"')}</div><div class="modal-body">${html}</div>`;$('#modal').showModal();}
function farmModal(){modal('Nova fazenda',`<form id="farm-form"><div class="form-grid"><div class="field full"><label>Nome da fazenda</label><input name="name" required maxlength="120" placeholder="Ex.: Fazenda Santa Helena"></div><div class="field full"><label>Produtor responsável</label><input name="producer" required maxlength="120" placeholder="Nome completo"></div><div class="field full"><label>Município / UF</label><input name="city" maxlength="120" placeholder="Ex.: Passos, MG"></div></div><div id="form-error" class="form-error" role="alert"></div><div class="form-footer"><small>O acesso do produtor pode ser cadastrado depois.</small><button class="primary">Cadastrar fazenda</button></div></form>`);}
function settingsModal(){const f=selected();if(!f)return;modal('Configurar fazenda',`<form id="settings-form"><div class="form-grid">${[['name','Fazenda',f.name],['producer','Produtor',f.producer],['city','Município / UF',f.city]].map(([key,l,v])=>`<div class="field"><label>${l}</label><input name="${key}" value="${esc(v)}" ${key==='city'?'':'required'}></div>`).join('')}</div><div class="form-section">Metas de acompanhamento</div><p class="muted" style="font-size:11px;margin-bottom:15px">Valide os critérios de acordo com a realidade da fazenda.</p><div class="form-grid">${[['ccs','CCS máxima · mil cél/mL'],['nulMin','NUL mínimo · mg/dL'],['nulMax','NUL máximo · mg/dL'],['queda','Queda de produtividade · %']].map(([k,l])=>`<div class="field"><label>${l}</label><input type="number" name="${k}" value="${f.targets[k]}" min="0" step="any" required></div>`).join('')}</div><div id="form-error" class="form-error" role="alert"></div><div class="form-footer"><span></span><button class="primary">Salvar configurações</button></div></form>`);}
let editingMember=null;
function memberModal(m=null){editingMember=m;modal(m?'Editar acesso':'Cadastrar acesso',`<form id="member-form"><div class="form-grid"><div class="field full"><label>E-mail de acesso</label><input name="email" type="email" required value="${esc(m?.email||'')}" ${m?'readonly':''}></div><div class="field"><label>Perfil</label><select name="role"><option value="client">Produtor · só preenche dados</option><option value="admin" ${m?.role==='admin'?'selected':''}>Consultor · acesso completo</option></select></div><div class="field"><label>Fazenda do produtor</label><select name="farmId"><option value="">Selecione</option>${S.farms.map(f=>`<option value="${f.id}" ${m?.farmId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div>${m?`<div class="field full"><label><input name="disabled" type="checkbox" style="width:auto" ${m.disabled?'checked':''}> Desativar este acesso</label></div>`:''}</div><div class="help">Consultores acessam todas as fazendas. Produtores só enviam dados para a propriedade vinculada.</div><div id="form-error" class="form-error" role="alert"></div><div class="form-footer"><small>Não envia convite por e-mail.</small><button class="primary">Salvar acesso</button></div></form>`);}
function draftKey(){return 'tonon-draft:'+S.user?.email+':'+S.selected;}
async function saveRecommendations(){if(S.demo){selected().recommendations=$('#recommendations')?.value||'';toast('Alterado apenas na demonstração.');return;}const f=selected();await api('farms',{...f,recommendations:$('#recommendations')?.value??f.recommendations},'PUT');await reload();toast('Recomendações salvas.');}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{
 if(a==='nav'){S.view=b.dataset.view;render();window.scrollTo(0,0);}
 else if(a==='demo')setDemo(true);
 else if(a==='exit-demo'){if(!S.user){toast('Esta é a demonstração local. O login será habilitado na publicação online.');return;}setDemo(false);}
 else if(a==='refresh'){if(S.demo){toast('Você está explorando dados de demonstração.');return;}await reload();}
 else if(a==='open-farm'){S.selected=b.dataset.id;S.start='';S.end='';S.view='farm';render();window.scrollTo(0,0);}
 else if(a==='new-farm'){if(!S.user){toast('Esta é a demonstração local. O login será habilitado na publicação online.');return;}if(S.demo)setDemo(false);farmModal();}
 else if(a==='new-visit'){if(selected())modal('Registrar visita · '+esc(selected().name),visitForm());}
 else if(a==='edit-visit'){const v=visits(selected(),false).find(v=>v.date===b.dataset.date);modal('Editar visita · '+dateFmt(v.date),visitForm(v));}
 else if(a==='close')$('#modal').close();
 else if(a==='clear-period'){S.start='';S.end='';render();}
 else if(a==='farm-settings')settingsModal();
 else if(a==='save-recommendations'){b.disabled=true;await saveRecommendations();}
 else if(a==='print'){if(!visits(selected()).length){toast('Sem visitas no período.');return;}window.print();}
 else if(a==='pdf'){
  if(S.demo){const f=selected(),v=visits(f);if(!v.length){toast('Sem visitas no período.');return;}download(new Blob([makePDF({...f,name:f.name+' (DEMONSTRAÇÃO)',recommendations:$('#recommendations')?.value||f.recommendations},v)],{type:'application/pdf'}),'demonstracao-gestao-tonon.pdf');toast('PDF demonstrativo gerado.');return;}
  if(!selected()||!visits(selected()).length){toast('Sem visitas no período.');return;}
  b.disabled=true;await saveRecommendations();const r=await fetch('/api/report?'+new URLSearchParams({farm:S.selected,start:S.start,end:S.end}));if(!r.ok)throw Error((await r.json()).error);download(await r.blob(),'relatorio-gestao-tonon.pdf');toast('Relatório PDF gerado.');
 }
 else if(a==='new-member'){if(S.demo){toast('Saia da demonstração para cadastrar acessos.');return;}memberModal();}
 else if(a==='edit-member')memberModal(S.members[+b.dataset.index]);
 else if(a==='preview-client'){if(!S.farms.length){toast('Cadastre uma fazenda primeiro.');return;}S.previewClient=true;render();}
 else if(a==='back-admin'){S.previewClient=false;render();}
 else if(a==='export'){if(S.demo){toast('Saia da demonstração para exportar dados reais.');return;}const d=await api('export');download(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),'gestao-tonon-backup.json');}
 else if(a==='recover-draft'){try{const d=JSON.parse(localStorage.getItem(draftKey()));if(!d){toast('Nenhum rascunho neste dispositivo.');return;}for(const [k,v] of Object.entries(d)){const el=$('#visit-form').elements.namedItem(k);if(el)el.value=v??'';}toast('Rascunho recuperado. Confira antes de enviar.');}catch{toast('Não foi possível recuperar o rascunho.');}}
 }catch(err){toast(err.message);}finally{b.disabled=false;}});
document.addEventListener('change',e=>{if(e.target.id==='farm-select'){S.selected=e.target.value;render();}if(['start','end'].includes(e.target.id)){S[e.target.id]=e.target.value;if(S.start&&S.end&&S.start>S.end){toast('A data inicial deve ser anterior à final.');S.end='';}render();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){S.query=e.target.value;$('#farm-rows').innerHTML=farmRows();}if(e.target.closest('#visit-form')&&!$('#visit-form').dataset.edit&&!S.demo&&!S.previewClient){try{localStorage.setItem(draftKey(),JSON.stringify(Object.fromEntries(new FormData($('#visit-form')))));$('#draft-status').textContent='Rascunho salvo neste dispositivo.';}catch{}}});
document.addEventListener('submit',async e=>{const form=e.target;if(!['farm-form','visit-form','settings-form','member-form'].includes(form.id))return;e.preventDefault();const submit=form.querySelector('[type="submit"]')||form.querySelector('button.primary');const err=form.querySelector('#form-error');err.textContent='';submit.disabled=true;
 try{if(S.demo||S.previewClient)throw Error('Esta visualização é demonstrativa. Use seus dados para salvar registros reais.');const d=Object.fromEntries(new FormData(form));
 if(form.id==='farm-form'){const f=await api('farms',d);S.selected=f.id;S.view='farm';}
 if(form.id==='visit-form'){for(const [k] of fields)d[k]=d[k]===''?null:Number(d[k]);const old=visits(selected(),false).find(v=>v.date===form.dataset.edit);await api('visits',{...d,farmId:S.selected,version:old?.version},old?'PUT':'POST');try{localStorage.removeItem(draftKey());}catch{}}
 if(form.id==='settings-form'){const targets={};for(const k of Object.keys(defaultTargets))targets[k]=Number(d[k]);await api('farms',{...selected(),name:d.name,producer:d.producer,city:d.city,targets},'PUT');}
 if(form.id==='member-form')await api('members',{...d,disabled:d.disabled==='on',version:editingMember?.version});
 $('#modal').close();await reload();toast(form.id==='visit-form'?'Visita recebida. O acompanhamento foi atualizado.':'Salvo com sucesso.');
 }catch(error){err.textContent=error.message;}finally{submit.disabled=false;}});
setDemo(true);
</script></body></html>
